name: Terraform

on:
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format
        run: terraform fmt -check
        working-directory: src/workload-production

      - name: Terraform Init
        run: terraform init
        working-directory: src/workload-production

      - name: Force Unlock State (one-time fix)
        run: terraform force-unlock -force 9f031687-6ad3-96fa-d90b-68abf0521c78
        working-directory: src/workload-production

      - name: Terraform Validate
        run: terraform validate
        working-directory: src/workload-production

      - name: Terraform Plan
        run: terraform plan -input=false
        working-directory: src/workload-production

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: terraform init
        working-directory: src/workload-production

      - name: Caution
        run: echo "⚠️ REVIEW IT CAREFULLY FIRST BEFORE APPLYING TERRAFORM APPLY ⚠️"

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
        working-directory: src/workload-production
