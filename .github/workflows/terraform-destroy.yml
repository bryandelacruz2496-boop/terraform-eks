name: Terraform Destroy

on:
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

jobs:
  destroy-workload:
    name: Destroy Workload (VPC, EKS, ECR)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: terraform init
        working-directory: src/workload-production

      - name: Force Unlock State (one-time fix)
        run: terraform force-unlock -force 31980bf4-02b5-29ca-1a3b-b6370c704e61
        working-directory: src/workload-production

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve
        working-directory: src/workload-production

  destroy-state:
    name: Destroy S3 State & DynamoDB
    runs-on: ubuntu-latest
    needs: destroy-workload
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve
