image: hashicorp/terraform:1.5.7

definitions:
  caches:
    terraform: .terraform

pipelines:
  branches:
    main:
      - step:
          name: Terraform Plan (Production)
          caches:
            - terraform
          script:
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
            - terraform init
            - terraform validate
            - terraform plan -input=false -out=tfplan.out
            - echo "⚠️  Review the plan carefully before approving!"
          artifacts:
            - tfplan.out

      - step:
          name: Terraform Apply (Production)
          deployment: production
          trigger: manual
          caches:
            - terraform
          script:
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
            - terraform init
            - terraform apply -input=false -auto-approve tfplan.out

    staging:
      - step:
          name: Terraform Plan (Staging)
          caches:
            - terraform
          script:
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
            - terraform init
            - terraform validate
            - terraform plan -input=false -out=tfplan.out
            - echo "Review the plan above before approving the apply step"
          artifacts:
            - tfplan.out

      - step:
          name: Terraform Apply (Staging)
          deployment: staging
          trigger: manual
          caches:
            - terraform
          script:
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
            - terraform init
            - terraform apply -input=false -auto-approve tfplan.out
